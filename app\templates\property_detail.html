{% extends 'base.html' %}{% block content %}<h1>{{prop.name}}</h1><p>{{prop.address}}</p><div class="grid">{% for a in apartments %}<section class="card"><h2>{{a.name}}</h2><p>{{a.area}} m² · {{a.tenant_count}} Mieter</p><p>Gebäudefläche: {{a.building_area}} m² · Einheiten: {{a.units_total}}</p></section>{% endfor %}</div><section class="card"><h2>Wohnung anlegen</h2><form method="post" action="/property/{{prop.id}}/apartments"><label>Bezeichnung<input name="name" required></label><label>Wohnfläche m²<input type="number" step="0.01" name="area"></label><label>Gesamtfläche m²<input type="number" step="0.01" name="building_area"></label><label>Personen gesamt<input type="number" step="0.01" name="persons_total" value="1"></label><label>Wohneinheiten gesamt<input type="number" step="0.01" name="units_total" value="1"></label><button>Anlegen</button></form></section>{% endblock %}

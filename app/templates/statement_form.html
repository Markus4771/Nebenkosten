{% extends 'base.html' %}{% block content %}<h1>Neue Abrechnung</h1>{% if tenants %}<form method="post" action="/statement/save" class="panel formgrid"><label>Mieter<select name="tenant_id">{% for t in tenants %}<option value="{{t.id}}">{{t.name}} – {{t.rental_object}}</option>{% endfor %}</select></label><label>Beginn<input type="date" name="period_start" required></label><label>Ende<input type="date" name="period_end" required></label><label>Vorauszahlungen gesamt<input type="number" step="0.01" name="advance_payments" value="0"></label><label class="full">Hinweise<textarea name="notes"></textarea></label><div class="full"><button>Abrechnung anlegen</button></div></form>{% else %}<div class="panel">Zuerst einen <a href="/tenant/new">Mieter anlegen</a>.</div>{% endif %}{% endblock %}

{% extends 'base.html' %}{% block content %}<h1>{{'Mieter bearbeiten' if tenant else 'Mieter und Wohnung anlegen'}}</h1><form method="post" action="/tenant/save" class="panel formgrid"><input type="hidden" name="tenant_id" value="{{tenant.id if tenant else 0}}"><label>Name<input name="name" required value="{{tenant.name if tenant else ''}}"></label><label>Anschrift<textarea name="address">{{tenant.address if tenant else ''}}</textarea></label><label>Mietobjekt<input name="rental_object" value="{{tenant.rental_object if tenant else ''}}" placeholder="Straße, Wohnung"></label><label>Wohnfläche m²<input type="number" step="0.01" name="apartment_area" value="{{tenant.apartment_area if tenant else 0}}"></label><label>Gesamtfläche m²<input type="number" step="0.01" name="building_area" value="{{tenant.building_area if tenant else 0}}"></label><label>Personen Wohnung<input type="number" step="0.01" name="persons" value="{{tenant.persons if tenant else 1}}"></label><label>Personen Gebäude<input type="number" step="0.01" name="building_persons" value="{{tenant.building_persons if tenant else 1}}"></label><label>Wohneinheiten<input type="number" step="0.01" name="units" value="{{tenant.units if tenant else 1}}"></label><label>Mietbeginn<input type="date" name="start_date" value="{{tenant.start_date if tenant else ''}}"></label><label>Mietende<input type="date" name="end_date" value="{{tenant.end_date if tenant else ''}}"></label><label>Status<select name="active"><option value="1" {{'selected' if not tenant or tenant.active else ''}}>Aktiv</option><option value="0" {{'selected' if tenant and not tenant.active else ''}}>Archiviert</option></select></label><div class="full"><button>Speichern</button></div><label>Monatliche Kaltmiete €<input name="monthly_cold_rent" type="number" step="0.01" value="{{ tenant.monthly_cold_rent if tenant else 0 }}"></label><label>Monatliche Nebenkostenvorauszahlung €<input name="monthly_operating_advance" type="number" step="0.01" value="{{ tenant.monthly_operating_advance if tenant else 0 }}"></label></form>{% endblock %}
